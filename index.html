<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    
    <!-- Primary Meta Tags -->
    <!-- Bhagya Ekanayake | Full-Stack Developer -->
    <title>Bhagya Ekanayake | Full-Stack Developer</title>
    <meta name="title" content="Bhagya Ekanayake | Full-Stack Developer" />
    <meta name="description" content="Portfolio of Bhagya Ekanayake, a Full-Stack Developer & Associate Software Engineer transforming complex ideas into elegant, production-ready code in Sri Lanka." />
    <meta name="keywords" content="Bhagya Ekanayake, Full-Stack Developer, Software Engineer, React, Python, DevOps, Sri Lanka, Web Developer" />
    <meta name="author" content="Bhagya Ekanayake" />

    <!-- Open Graph / Facebook (Social Media වල Share කරද්දී පෙනෙන විදිහ) -->
    <meta property="og:type" content="website" />
    <!-- (පහළ URL එක ඔයාගේ ඇත්තම GitHub Pages link එකට වෙනස් කරන්න) -->
    <meta property="og:url" content="https://poornabhagya.github.io/Bhagya-Ekanayake_Personal_Portfolio/" />
    <meta property="og:title" content="Bhagya Ekanayake | Full-Stack Developer" />
    <meta property="og:description" content="Check out my web development portfolio and projects. Transforming complex ideas into elegant code." />
    <!-- (පහළ තියෙන්නේ share කරද්දී පෙන්වන පින්තූරය. public folder එකට preview.png කියලා එකක් දාලා link කරන්න) -->
    <meta property="og:image" content="https://poornabhagya.github.io/Bhagya-Ekanayake_Personal_Portfolio/preview.jpg" />

    <!-- Twitter / X -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://poornabhagya.github.io/Bhagya-Ekanayake_Personal_Portfolio/" />
    <meta property="twitter:title" content="Bhagya Ekanayake | Full-Stack Developer" />
    <meta property="twitter:description" content="Check out my web development portfolio and projects. Transforming complex ideas into elegant code." />
    <meta property="twitter:image" content="https://poornabhagya.github.io/Bhagya-Ekanayake_Personal_Portfolio/preview.jpg" />

    <!-- Favicon (Browser එකේ උඩින් පෙන්වන පොඩි අයිකන් එක) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- CSS Reset (ඔයාගේ කලින් තිබ්බ එක) -->
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
